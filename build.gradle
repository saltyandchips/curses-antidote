plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

def modVersion = '1.0.0'

version = modVersion
group = 'cn.blockforge.curses_antidote'
base { archivesName = 'curses_antidote' }

tasks.withType(Jar).configureEach {
    archiveBaseName = 'curses_antidote-forge1.20.1'
    archiveVersion = modVersion
    exclude '**/*.java'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { }
        server { args '--nogui' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.22'
    compileOnly files('libs/curios-forge-5.14.1+1.20.1-deobf.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [mod_id: 'curses_antidote', mod_name: 'Curses Antidote', mod_version: modVersion,
                 minecraft_version: '1.20.1', forge_version: '47.3.22']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}

jar.finalizedBy('reobfJar')
